<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Stock Prediction - Stock Prediction Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_stock.css') }}">
</head>
<body>
    <div class="edit-container">
        <div class="edit-card">
            <div class="edit-header">
                <h2>Edit Stock Prediction</h2>
                <a href="{{ url_for('dashboard') }}" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
            <form method="POST">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ stock_entry[2] }}" required>
                </div>
                <div class="form-group">
                    <label for="stock_symbol">Stock Symbol</label>
                    <input type="text" id="stock_symbol" name="stock_symbol" value="{{ stock_entry[3] }}" required>
                </div>
                <div class="form-group">
                    <label for="prediction_date">Prediction Date</label>
                    <input type="date" id="prediction_date" name="prediction_date" value="{{ stock_entry[4] }}" required>
                </div>
                <div class="form-group">
                    <label for="predicted_value">Predicted Value</label>
                    <input type="text" id="predicted_value" name="predicted_value" value="{{ stock_entry[5] }}" required>
                </div>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
